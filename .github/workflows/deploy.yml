name: Deploy — Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."   # Worker racine (fx-jam) : site + /api/*
          secrets: |
            SC_CLIENT_SECRET
        env:
          SC_CLIENT_SECRET: ${{ secrets.SC_CLIENT_SECRET }}

      # Worker media (media.hamcat.live, bucket R2) — deploye apres le site pour qu'un
      # echec ici ne bloque jamais la mise en ligne de hamcat.live.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "workers/media-browser"

